<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="container my-5">
        <h1 class="mb-4">Formulario de contacto</h1>

        <form id="formContacto">
            <div class="mb-3"><label for="nombre" class="form-label">Nombre</label><input type="text" class="form-control" id="nombre" name="nombre" required></div>
            <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
            <div class="mb-3"><label for="telefono" class="form-label">Teléfono</label><input type="tel" class="form-control" id="telefono" name="telefono" required></div>
            <div class="mb-3"><label for="asunto" class="form-label">Asunto</label><input type="text" class="form-control" id="asunto" name="asunto" required></div>
            <div class="mb-3"><label for="mensaje" class="form-label">Cuerpo del mensaje</label><textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea></div>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <a href="index.html" class="btn btn-outline-secondary">Volver</a>
        </form>
        <div id="aviso" class="alert alert-info mt-3 d-none" role="status">Formulario validado. Este ejemplo no envía correos porque no tiene servidor configurado.</div>
    </main>
    <script>
      document.getElementById('formContacto').addEventListener('submit', function (evento) {
        evento.preventDefault();
        document.getElementById('aviso').classList.remove('d-none');
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
