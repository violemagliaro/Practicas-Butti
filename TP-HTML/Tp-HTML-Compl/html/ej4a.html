<html>
    <head>
        <title>Ejercicio 4a</title>
        <link rel="stylesheet" href="../css/estilo4.css">
        <meta charset="UTF-8">
        
    </head>
    <body>
            <h3>Formulario 4-a</h3>
        
            <form action="#" class="formulario">
                <!--El atributo: action="#" indica a dónde se van a enviar los datos cuando se confirme el formulario.-->
                
                Usuario:
                <input type="text" id="Usuario" autofocus required>
                <!--input crea un elemento de entrada. Dependiendo del type, puede ser una caja de texto, contraseña, botón, etc-->
                <input type="submit" value ="Continuar">
                <!--submit significa que ese input va a funcionar como botón de envío.-->
                <!--value="Confirmar" indica el texto que se muestra dentro del botón.-->
                <!--Cuando apretás Confirmar, se intenta enviar el formulario según lo que hayas puesto en action.-->

            </form>
        
    </body>


</html>
